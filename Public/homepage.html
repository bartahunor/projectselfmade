<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="style.css">
    <title>TudásTér</title>
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col-12">

            <section class="hero">

                <img src="Pictures/homepagepicture.jpg" class="hero-bg" alt="">

                <div class="hero-overlay"></div>

                <div class="container hero-content">
                    <div class="row align-items-center min-vh-100">

                        <!-- Bal oldal -->
                        <div class="col-lg-8 text-white hero-left pt-5"">
                            <h1>Gyakorolj tudatosan, érettségizz magabiztosan.</h1>

                            <button class="start-btn" id="gotoTervezo">
                                Gyakorlásra fel
                            </button>

                        </div>

                        <!-- Jobb oldal preview card -->
                        <div class="col-lg-4 d-flex justify-content-center">
                            <div class="preview-card">
                                <img src="Pictures/logo.png" class="logo-hero" alt="TudásTér">
                            </div>
                        </div>

                    </div>
                </div>

            </section>
            <section class="about-app py-5">
                <div class="container text-center">
                    <h2>Mi a TudásTér?</h2>
                    <p class="lead mt-3">
                        A TudásTér egy innovatív gyakorló platform, amely segít a diákoknak 
                        tudatosan felkészülni az érettségire. Gyakorolj tematikusan, kövesd a fejlődésed, 
                        és készülj magabiztosan a vizsgákra.
                    </p>
                </div>
            </section>

        </div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
