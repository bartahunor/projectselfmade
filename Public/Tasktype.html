<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Érettségi Felkészítő - Feladat kiválasztás</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#351F5B",
                        primaryLight: "#4B2A7F",
                        primaryDark: "#24123D",
                        backgroundLight: "#F4F2F8",
                        backgroundDark: "#140C22"
                    },
                    fontFamily: {
                        display: ["Lexend"]
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Lexend', sans-serif;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-backgroundLight dark:bg-backgroundDark min-h-screen text-slate-800 dark:text-slate-100 font-display">

    <!-- NAVBAR -->
    <nav class="border-b border-primary/20 bg-white/80 dark:bg-primaryDark/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">

            <div class="flex items-center">
                <img src="Pictures/logo.png" alt="GraduHungary logo" class="h-10 w-auto object-contain">
            </div>

            <div class="flex items-center gap-6">
                <a href="#" class="text-sm font-medium hover:text-primary transition-colors">
                    Tananyagok
                </a>
                <a href="#" class="text-sm font-medium hover:text-primary transition-colors">
                    Statisztika
                </a>

                <div
                    class="h-9 w-9 rounded-full bg-primary/10 border border-primary/30 flex items-center justify-center">
                    <span class="material-icons text-primary text-sm">person</span>
                </div>
            </div>

        </div>
    </nav>

    <!-- MAIN -->
    <main class="max-w-7xl mx-auto px-6 py-12">

        <header class="text-center mb-14">
            <h1 class="text-4xl font-bold text-primary mb-4">
                Válaszd ki az érettségi paramétereit
            </h1>
            <p class="text-slate-500 dark:text-slate-400 max-w-2xl mx-auto">
                Állítsd össze a gyakorló feladatsort a tárgy, a szint és az évszám kiválasztásával.
            </p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">

            <!-- TANTÁRGY -->
            <section class="lg:col-span-5 space-y-6">
                <h2 class="text-sm font-semibold uppercase tracking-widest text-primary/60">
                    1 · Tantárgy
                </h2>

                <div class="grid grid-cols-2 gap-4">

                    <button data-subject="Irodalom"
                        class="subjectBtn p-6 bg-white dark:bg-primaryDark border-2 border-transparent rounded-2xl transition-all">
                        <span class="material-icons text-primary text-4xl mb-3">menu_book</span>
                        <p class="font-semibold">Irodalom</p>
                    </button>

                    <button data-subject="Történelem"
                        class="subjectBtn p-6 bg-white dark:bg-primaryDark border-2 border-transparent rounded-2xl transition-all">
                        <span class="material-icons text-primary/40 text-4xl mb-3">history_edu</span>
                        <p class="font-semibold">Történelem</p>
                    </button>

                </div>
            </section>

            <!-- SZINT -->
            <section class="lg:col-span-3 space-y-6">
                <h2 class="text-sm font-semibold uppercase tracking-widest text-primary/60">
                    2 · Szint
                </h2>

                <div class="space-y-4">

                    <button data-level="Középszint"
                        class="levelBtn w-full text-left p-6 bg-white dark:bg-primaryDark border-2 border-transparent rounded-2xl transition-all">
                        <h3 class="font-bold text-lg">Középszint</h3>
                    </button>

                    <button data-level="Emelt szint"
                        class="levelBtn w-full text-left p-6 bg-white dark:bg-primaryDark border-2 border-transparent rounded-2xl transition-all">
                        <h3 class="font-bold text-lg">Emelt szint</h3>
                    </button>

                </div>
            </section>

            <!-- ÉV -->
            <section class="lg:col-span-4 space-y-6">
                <h2 class="text-sm font-semibold uppercase tracking-widest text-primary/60">
                    3 · Évszám
                </h2>

                <div
                    class="bg-white dark:bg-primaryDark rounded-2xl border border-primary/20 overflow-hidden shadow-lg shadow-primary/5">

                    <div class="h-[400px] overflow-y-auto p-4 space-y-3 scrollbar-hide">

                        <button data-year="2024"
                            class="yearBtn w-full p-4 border-2 border-transparent rounded-xl transition-all font-medium">
                            2024
                        </button>

                        <button data-year="2023"
                            class="yearBtn w-full p-4 border-2 border-transparent rounded-xl transition-all font-medium">
                            2023
                        </button>

                    </div>
                </div>
            </section>
        </div>

        <!-- START BUTTON -->
        <div class="mt-20 text-center">
            <button id="startBtn" disabled
                class="px-14 py-6 bg-primary text-white rounded-full text-lg font-bold shadow-2xl shadow-primary/30 opacity-50 cursor-not-allowed transition-all">
                Gyakorlás indítása
            </button>
        </div>

    </main>

    <!-- SCRIPT -->
    <script>
        const subjectBtns = document.querySelectorAll(".subjectBtn");
        const levelBtns = document.querySelectorAll(".levelBtn");
        const yearBtns = document.querySelectorAll(".yearBtn");
        const startBtn = document.getElementById("startBtn");

        let subject = null;
        let level = null;
        let year = null;

        function activate(buttons, selectedBtn) {
            buttons.forEach(btn => {
                btn.classList.remove("border-primary", "bg-primary/10", "shadow-lg", "shadow-primary/20");
                btn.classList.add("border-transparent");
            });

            selectedBtn.classList.remove("border-transparent");
            selectedBtn.classList.add("border-primary", "bg-primary/10", "shadow-lg", "shadow-primary/20");
        }

        function checkReady() {
            if (subject && level && year) {
                startBtn.disabled = false;
                startBtn.classList.remove("opacity-50", "cursor-not-allowed");
            }
        }

        subjectBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                activate(subjectBtns, btn);
                subject = btn.dataset.subject;
                checkReady();
            });
        });

        levelBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                activate(levelBtns, btn);
                level = btn.dataset.level;
                checkReady();
            });
        });

        yearBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                activate(yearBtns, btn);
                year = btn.dataset.year;
                checkReady();
            });
        });

        startBtn.addEventListener("click", () => {
            alert(
                "Kiválasztva:\n\n" +
                "Tantárgy: " + subject +
                "\nSzint: " + level +
                "\nÉv: " + year
            );
        });
    </script>

</body>
</html>
